repos:
  - repo: local
    hooks:
      # `gen-doc` runs first so the documentation it rewrites is already current
      # by the time `lint` compares it against the sources.
      - id: gen-doc
        name: Generate documentation
        entry: bash scripts/docs.sh
        language: system
        types:
          - file
        files: \.(sh|bats)$
        pass_filenames: false
      - id: lint
        name: Lint the repository
        entry: bash scripts/lint.sh
        language: system
        types:
          - file
        files: \.(sh|bats|md)$|^\.shellcheckrc$
        pass_filenames: false
      # Only the tests covering the staged files run here; CI runs the suite.
      # `require_serial` keeps the file list in one invocation, so the runner
      # sees every change at once and Bats owns the parallelism.
      - id: test
        name: Test the changed files
        entry: bash scripts/test.sh --related
        language: system
        types:
          - file
        files: \.(sh|bats|bash)$
        require_serial: true
