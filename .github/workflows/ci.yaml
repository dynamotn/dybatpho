name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    name: "Repository lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # gitleaks scans history, which needs more than the default shallow clone.
          fetch-depth: 0

      - name: "Install dependencies"
        env:
          YQ_VERSION: v4.53.3
          # The lint toolchain deliberately floats: `dyshellint` and the two
          # tools it drives are always fetched at their latest release, so a
          # rule or a formatting change reaches this job the day it ships
          # rather than whenever someone remembers to bump a pin. The runner
          # image's own ShellCheck is too old to use — 0.9.0 reports SC2317,
          # SC2119 and SC2015 false positives on this code that later versions
          # dropped — so it is replaced rather than relied on.
          #
          # The token is only to lift the unauthenticated API rate limit, which
          # a shared runner IP exhausts quickly.
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing gawk jq

          latest_tag() {
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/$1/releases/latest" | jq -r .tag_name
          }

          shellcheck_version="$(latest_tag koalaman/shellcheck)"
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${shellcheck_version}/shellcheck-${shellcheck_version}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp "shellcheck-${shellcheck_version}/shellcheck"
          sudo install -m 0755 "/tmp/shellcheck-${shellcheck_version}/shellcheck" /usr/local/bin/shellcheck

          shfmt_version="$(latest_tag mvdan/sh)"
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${shfmt_version}/shfmt_${shfmt_version}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

          # The asset name carries no version, so this one needs no lookup.
          curl -fsSL \
            "https://github.com/dynamotn/dyshellint/releases/latest/download/dyshellint_linux_amd64.tar.gz" \
            | tar -xzf - -C /tmp dyshellint
          sudo install -m 0755 /tmp/dyshellint /usr/local/bin/dyshellint

          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          shellcheck --version | head -n 2
          shfmt --version
          dyshellint -version | head -n 1

      - name: "Lint"
        # `dyshellint` over every tracked script — the Bash coding style guide's
        # own rules plus ShellCheck and shfmt — Keep a Changelog conformance,
        # generated-documentation drift, and a bundle that still builds and loads.
        run: bash scripts/lint.sh

      - name: "Scan for committed secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: kcov/kcov
    steps:
      - name: "Install dependencies"
        env:
          # Pin the JSON backend: Debian's `yq` package is a different program
          # with a different expression language, so the Go implementation the
          # library is written against is fetched directly.
          YQ_VERSION: v4.53.3
        run: |
          # gawk: `scripts/docs.sh`, which the conventions tests run, needs it.
          # locales: the base image carries no UTF-8 locale, and bash only
          # walks a string character by character under one. Without it the
          # screen widgets and `dybatpho::string_slugify` see raw bytes.
          # bzip2: `tar` shells out to it, and the backup tests archive with
          # `DYBATPHO_BACKUP_EXTENSION=tar.bz2`.
          apt-get update && apt-get install -y --fix-missing git parallel curl netcat-openbsd jq gawk locales bzip2
          locale -a | grep -qix 'C\.utf-\?8' || localedef -i C -f UTF-8 C.UTF-8
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
          yq --version
          jq --version
          # With a home: the AI example keeps its counters under the XDG state
          # home, and a user without one cannot create it.
          useradd -m test

      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Test"
        run: |
          # `su -` resets the environment, so the worker count and the JSON
          # backend are both checked from inside the test user's own shell.
          su - test -c "command -v yq && command -v jq"
          chown -R test $(pwd)
          # kcov never releases the trace state it accumulates, so a single
          # invocation over the whole suite grows until the OOM killer takes the
          # run down with exit 137. `--coverage` runs one invocation per chunk of
          # test files, which keeps the peak at whatever the largest chunk needs.
          #
          # That peak tracks the tests in one chunk (~16 MiB each) and not the
          # worker count: measured over the same files, 2 and 4 workers peaked at
          # 2613 and 2615 MiB. So `--chunk` is the memory knob and `--jobs` is
          # free, which makes one worker per vCPU the right setting -- a standard
          # runner has 4. `scripts/test.sh` balances the chunks by test count, so
          # 5 files per chunk is ~180 tests, or well under 3 GiB of the 16 GiB
          # the runner has.
          su - test -c "LANG=C.UTF-8 LC_ALL=C.UTF-8 DYBATPHO_TEST_JOBS=4 DYBATPHO_TEST_CHUNK=5 bash $(pwd)/scripts/test.sh --coverage"

      - name: "Coveralls"
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: "cobertura"
          files: "coverage/bats/cobertura.xml"

  busybox:
    name: "BusyBox userland (Alpine)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: alpine:3.22.1
    steps:
      - name: "Install dependencies"
        env:
          YQ_VERSION: v4.53.3
        # Deliberately no `coreutils`. `AGENT.md` claims BusyBox portability,
        # and installing GNU coreutils here would quietly test GNU tools on
        # musl instead — which is what the repository's own Dockerfile does,
        # so building that image would not have checked the claim either.
        run: |
          apk add --no-cache bash git curl gawk jq parallel tar xz zip unzip gzip bzip2 zstd openssl ca-certificates tzdata python3 shadow
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
          # tzdata is not optional here: without it every named timezone
          # silently resolves to UTC, and the date and i18n helpers quietly
          # give the wrong answer rather than failing.
          date --version > /dev/null 2>&1 && echo "date is GNU, the job is not testing what it claims" && exit 1
          echo "date, sed, find and stat are BusyBox applets"

      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Run the suite"
        # As a user permissions apply to: several tests assert that a write is
        # refused, and root is refused nothing.
        run: |
          git config --global --add safe.directory "$(pwd)"
          adduser -D runner
          chown -R runner .
          su runner -s /bin/bash -c "test/lib/core/bin/bats --jobs 4 test/*.bats"

  portable:
    name: "Portable smoke tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Install a modern bash (macOS ships bash 3.2)"
        if: runner.os == 'macOS'
        run: |
          brew list bash > /dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"
      - name: "Install GNU parallel so Bats can use more than one worker"
        if: runner.os == 'macOS'
        run: brew list parallel > /dev/null 2>&1 || brew install parallel
      - name: "Install gawk, which the documentation check needs"
        if: runner.os == 'macOS'
        run: brew list gawk > /dev/null 2>&1 || brew install gawk
      - name: "Run the suite"
        # Three files used to run here, which left everything that touches
        # `stat`, `sed` or `find` unchecked on a BSD userland — `stat -c` in
        # `testing.sh` is GNU-only and no macOS job ever reached it.
        run: |
          command -v bash
          bash --version | head -n 1
          test/lib/core/bin/bats --jobs 4 test/*.bats
